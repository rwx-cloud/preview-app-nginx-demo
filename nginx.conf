events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  map $http_x_forwarded_proto $public_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  server {
    listen 8080;
    server_name _;

    location = /health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      proxy_pass http://127.0.0.1:3000/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $public_proto;
    }

    # This is the real S3 bucket name, not a prefix that gets stripped.
    # Preserving the original host, path, and query string is what lets MinIO
    # validate a URL signed for the public Nginx origin.
    location ^~ /demo-bucket/ {
      proxy_pass http://127.0.0.1:9000;
      proxy_set_header Host $http_host;
      proxy_request_buffering off;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
